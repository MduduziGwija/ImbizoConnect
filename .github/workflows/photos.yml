name: Campus photos

# Campus photos for the landing page. On a working branch, listing photos in
# assets/img/campus/photos.json (Unsplash id, name, caption, alt) downloads them as WebP
# through the Unsplash API (UNSPLASH_ACCESS_KEY secret) and commits them back as the
# person who pushed. Without photos.json, tools/photos/candidates.mjs saves review
# previews to photo-candidates/ instead (never merged).
on:
  push:
    branches-ignore: [main]
    paths: ['tools/photos/**', 'assets/img/campus/photos.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Candidates
        if: ${{ hashFiles('assets/img/campus/photos.json') == '' }}
        run: node tools/photos/candidates.mjs
      - name: Chosen photos
        if: ${{ hashFiles('assets/img/campus/photos.json') != '' }}
        run: node tools/photos/fetch.mjs
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - name: Commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          for d in photo-candidates assets/img/campus; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update campus photos" && git push; fi
