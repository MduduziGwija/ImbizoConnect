name: Campus photos

# Review step: changing tools/photos/candidates.mjs on a working branch saves preview
# thumbnails to photo-candidates/ (never merged). Changing assets/img/campus/photos.json
# downloads the chosen photos as WebP. Both commit back as the person who pushed.
on:
  push:
    branches-ignore: [main]
    paths: ['tools/photos/**', 'assets/img/campus/photos.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Candidates
        if: ${{ hashFiles('assets/img/campus/photos.json') == '' }}
        run: node tools/photos/candidates.mjs
      - name: Chosen photos
        if: ${{ hashFiles('assets/img/campus/photos.json') != '' }}
        run: node tools/photos/fetch.mjs
      - name: Commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          for d in photo-candidates assets/img/campus; do [ -e "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update campus photos" && git push; fi
